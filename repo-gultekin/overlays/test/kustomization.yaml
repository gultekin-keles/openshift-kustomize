apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: repo-gultekin-test

resources:
  - ../../components/apache/base

replicas:
  - name: apache
    count: 1

commonLabels:
  environment: test

configMapGenerator:
  - name: apache-index-html
    literals:
      - index.html=<html><body><h1>repo-gultekin Apache - TEST</h1></body></html>
