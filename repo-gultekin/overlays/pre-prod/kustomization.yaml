apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: repo-gultekin-pre-prod

resources:
  - ../../components/apache/base

replicas:
  - name: apache
    count: 2

commonLabels:
  environment: pre-prod

configMapGenerator:
  - name: apache-index-html
    literals:
      - index.html=<html><body><h1>repo-gultekin Apache - PRE-PROD</h1></body></html>
